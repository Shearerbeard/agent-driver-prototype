[package]
name = "agent-driver-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# agent-driver-rs, pinned by git rev to the public repo (both here and in
# dev-dependencies so features unify). Bump with `cargo update -p agent-driver-rs`
# after changing `rev`. The S70 frame port does not call it yet; the loop
# wiring lands in S71. Present so the crate always compiles against the pin
# the flow depends on.
# S73: the `bedrock` feature is enabled so the shim can construct a
# Bedrock-backed `Provider` via `ProviderConfig::from_env()`. The `phoenix`
# feature is deliberately NOT enabled: the shim wires OTEL directly through
# its own `opentelemetry` deps rather than inheriting the pin's Phoenix
# tracing pipeline. See `src/sse_shim/DESIGN.md` for the rationale.
agent-driver-rs = { git = "https://github.com/Shearerbeard/agent-driver-rs", rev = "82ee41f298513876bfe8f7735d4f3f48eb92651f", features = ["bedrock"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The MCP client: rmcp carries the JSON-RPC envelope, the handshake, and
# the streamable-HTTP session; the legacy SSE transport is in-tree
# (src/mcp_client/sse_transport.rs). Only the `client` and
# streamable-HTTP features are on; this is the graph's only rmcp.
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
# SSE frame parsing for the legacy-transport receive half — the same crate
# rmcp's own streamable client parses its streams with, so the dependency
# unifies to the copy already in the graph.
sse-stream = "0.2"
# `Stream`/`StreamExt` for the shim's SSE response bodies and their tests.
futures = "0.3"
# HTTP header types (`HeaderName`, `HeaderValue`) for rmcp's per-server
# custom-header config — `http` 1.x unifies across this reqwest and rmcp's,
# so the re-exports are the exact types rmcp expects. Also the HTTP client
# the sse_shim integration tests drive the shim with.
reqwest = "0.12"
# URL parsing and RFC 3986 join for the SSE endpoint frame resolution in
# `src/mcp_client/sse_transport.rs`.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1"
# Runtime + async primitives: `#[tokio::main]` for the binaries,
# `tokio::time::timeout` for bounded response reads, and graceful-shutdown
# signal handling for the shim. Also a dev-dep so the integration-test
# crate can name `tokio` directly; features unify.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tracing = "0.1"

# --- S73: SSE shim server deps ---

# HTTP server for the shim's `/health` and `/v1/chat/completions` endpoints.
# `axum::response::sse::Sse` provides the SSE response body; `Json` extracts
# the chat-completions request body. No tower-http/cors: localhost harness
# traffic only.
axum = "0.8"

# OpenTelemetry for the trace-receipt canary: OTEL spans carry `session.id`
# so Phoenix can query a uniquely tagged span back. The shim wires OTEL
# directly rather than enabling the pin's `phoenix` feature. Versions match
# the pin's own `phoenix` feature deps so the dep tree unifies.
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
# Bridge `tracing` spans to the OTEL pipeline so existing `tracing::info_span!`
# calls in the coordinator loop are exported as OTEL spans. Pinned to 0.33
# (not the DESIGN.md §8's 0.30): 0.30 targets opentelemetry 0.29, which does
# not unify with the pin's opentelemetry 0.32 the rest of this matrix
# matches. 0.33 is the first release targeting opentelemetry ^0.32.
tracing-opentelemetry = "0.33"
# Env-filter subscriber for the shim's tracing init.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# S73 item 7: `src/config.rs` does not parse TOML (its `OrchestrationConfig`
# is a hand-mirror, not `Deserialize`), so the shim binary parses a minimal
# subset of the adapter-patched config TOML directly: the worker roster, the
# planning/turn budgets, the inline spill threshold, and the model identity.
# Malformed TOML fails loud.
toml = "0.8"

[dev-dependencies]
# The mock provider lives behind `test-support`; integration tests are a
# separate crate where the library's own `cfg(test)` does not apply.
agent-driver-rs = { git = "https://github.com/Shearerbeard/agent-driver-rs", rev = "82ee41f298513876bfe8f7735d4f3f48eb92651f", features = ["test-support"] }
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tokio-util = "0.7"
