[package]
name = "agent-driver-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Pinned worktree of agent-driver-rs at 674a093. The S70 frame port does
# not call it yet; the loop wiring lands in S71. Present now so the crate
# always compiles against the pin the flow depends on.
agent-driver-rs = { path = "../agent-driver-rs-pin" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
