[package]
name = "agent-driver-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Pinned worktree of agent-driver-rs at 674a093. The S70 frame port does
# not call it yet; the loop wiring lands in S71. Present now so the crate
# always compiles against the pin the flow depends on.
# S73: the `bedrock` feature is enabled so the shim can construct a
# Bedrock-backed `Provider` via `ProviderConfig::from_env()`. The `phoenix`
# feature is deliberately NOT enabled: the shim wires OTEL directly through
# its own `opentelemetry` deps rather than inheriting the pin's Phoenix
# tracing pipeline. See `src/sse_shim/DESIGN.md` for the rationale.
agent-driver-rs = { path = "../agent-driver-rs-pin", features = ["bedrock"] }
async-trait = "0.1"
# `Bytes` is the chunk type of the reqwest SSE response stream and is named in
# the `dyn Stream<Item = Result<Bytes, reqwest::Error>>` field of `SseReader`.
# Already a transitive dep of reqwest; declared directly so the type is not
# borrowed through a transitive crate.
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `StreamExt::next` pulls chunks from the long-lived SSE GET response, as the
# aura `mcp_sse.rs` source does. No SSE-frame crate is pulled: the frame
# parser is a pure function over a UTF-8 buffer (unit-tested against F3).
futures = "0.3"
# HTTP client for the SSE GET and the JSON-RPC POSTs. Pinned to 0.12 to match
# the agent-driver-rs pin (a 0.13 copy exists transitively via async-openai;
# declaring 0.12 avoids a second direct major version). The `stream` feature
# gates `Response::bytes_stream` for the open SSE stream.
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.26", features = ["derive"] }
thiserror = "1"
# Runtime + async primitives: `#[tokio::main]` for the probe binary,
# `tokio::sync::Mutex` to hold the SSE stream across `.await`, and
# `tokio::time::timeout` for bounded response reads. Also a dev-dep so the
# integration-test crate can name `tokio` directly; features unify.
# S73: the `signal` feature gates `tokio::signal::ctrl_c()` for graceful
# shim shutdown.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tracing = "0.1"
# RFC 3986 resolution of the relative `endpoint` event URL against the SSE
# base URL in `SidecarClient::connect`, matching aura's `url::Url::join`.
# `SidecarUrl::new` keeps its prefix check; full parse happens in `connect`.
url = "2"

# --- S73: SSE shim server deps ---

# HTTP server for the shim's `/health` and `/v1/chat/completions` endpoints.
# `axum::response::sse::Sse` provides the SSE response body; `Json` extracts
# the chat-completions request body. No tower-http/cors: localhost harness
# traffic only.
axum = "0.8"

# OpenTelemetry for the trace-receipt canary: OTEL spans carry `session.id`
# so Phoenix can query a uniquely tagged span back. The shim wires OTEL
# directly rather than enabling the pin's `phoenix` feature. Versions match
# the pin's own `phoenix` feature deps so the dep tree unifies.
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
# Bridge `tracing` spans to the OTEL pipeline so existing `tracing::info_span!`
# calls in the coordinator loop are exported as OTEL spans. Pinned to 0.33
# (not the DESIGN.md §8's 0.30): 0.30 targets opentelemetry 0.29, which does
# not unify with the pin's opentelemetry 0.32 the rest of this matrix
# matches. 0.33 is the first release targeting opentelemetry ^0.32.
tracing-opentelemetry = "0.33"
# Env-filter subscriber for the shim's tracing init.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# S73 item 7: `src/config.rs` does not parse TOML (its `OrchestrationConfig`
# is a hand-mirror, not `Deserialize`), so the shim binary parses a minimal
# subset of the adapter-patched config TOML directly: the worker roster, the
# planning/turn budgets, the inline spill threshold, and the model identity.
# Malformed TOML fails loud.
toml = "0.8"

[dev-dependencies]
# The mock provider lives behind `test-support`; integration tests are a
# separate crate where the library's own `cfg(test)` does not apply.
agent-driver-rs = { path = "../agent-driver-rs-pin", features = ["test-support"] }
insta = { version = "1", features = ["json"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
