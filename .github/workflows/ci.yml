# Hermetic CI: no secrets, no AWS env, no live providers. The whole test
# suite runs offline (MockProvider-backed loops, localhost-only listeners);
# the credential-needing surfaces (the sse_shim and sidecar_probe binaries)
# are run manually, never by `cargo test`.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # 1.91.1 is the crate's declared `rust-version`; testing at it keeps
      # the MSRV honest.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo test --locked
